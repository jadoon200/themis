# Local, zero-cost, credential-free. The target name must stay within the THEMIS
# execution allowlist — the Stage 3 guard refuses anything that is not clearly a
# dev/CI target.
themis_demo:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: themis_demo.duckdb
      schema: main
      threads: 4
      # A second catalog. Trino projects routinely join across catalogs, and that is
      # the one case the engine cannot push down — both sides are read in full and
      # joined on the coordinator. Attaching one here makes that testable locally.
      attach:
        - path: reference.duckdb
          alias: reference
