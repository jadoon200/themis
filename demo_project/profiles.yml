# Local, zero-cost, credential-free. The target name must stay within the THEMIS
# execution allowlist — the Stage 3 guard refuses anything that is not clearly a
# dev/CI target.
themis_demo:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: themis_demo.duckdb
      schema: main
      threads: 4
      # A second catalog. Trino projects routinely join across catalogs, and that is
      # the one case the engine cannot push down — both sides are read in full and
      # joined on the coordinator. Attaching one here makes that testable locally.
      attach:
        - path: reference.duckdb
          alias: reference

    # The engine THEMIS actually targets. Running the demo project here as well as on
    # DuckDB is what makes the rules exercised against Trino-compiled SQL rather than
    # against a dialect that merely resembles it — the two disagree on decimal
    # arithmetic, on how date_trunc parses, and on what a three-part name means.
    #
    # The memory connector holds everything in the coordinator's heap, which is fine
    # for a demo of this size and needs no object store to stand up.
    trino:
      type: trino
      method: none
      user: themis
      host: 127.0.0.1
      port: 8085
      catalog: memory
      schema: main
      threads: 4
      http_scheme: http
