name: CI

# Frugal by design: ubuntu-only, single Python, narrow triggers, in-progress runs
# cancelled. No model is ever downloaded here — the review runs deterministic-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres is here because SELECT ... FOR UPDATE SKIP LOCKED is the whole basis for
    # handing a queued run to exactly one worker, and SQLite has no row locking — the
    # clause is skipped there, so without a real database that path is never exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: themis
          POSTGRES_PASSWORD: themis
          POSTGRES_DB: themis
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U themis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      THEMIS_TEST_POSTGRES_URL: postgresql+psycopg://themis:themis@127.0.0.1:5436/themis
      THEMIS_TEST_TRINO_HOST: 127.0.0.1
      THEMIS_TEST_TRINO_PORT: "8085"
      # The MCP tests skip themselves without the optional SDK, which would leave the
      # protocol adapter covered only by its own conversion functions — and those pass
      # whatever the SDK renames. Here, a missing SDK fails instead of skipping.
      THEMIS_REQUIRE_MCP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Start Trino (Hive and Iceberg catalogs)
        # The repository's own compose service, not a bare image: the catalogs are files
        # in the checkout, and a service container starts before the checkout exists.
        run: docker compose up -d --wait trino

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/themis

      - name: Migrations apply to Postgres
        env:
          THEMIS_DATABASE_URL: postgresql+psycopg://themis:themis@127.0.0.1:5436/themis
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q

      - name: Confirm the Trino client tests actually ran
        # They skip themselves when no engine is reachable, so a broken service
        # container would quietly drop the target engine from coverage.
        run: pytest tests/test_warehouse_trino.py -q --no-header | grep -q "passed"

      - name: Confirm the Postgres queue tests actually ran
        # These skip themselves when no database is reachable, so a broken service
        # container would silently reduce coverage rather than fail.
        run: pytest tests/test_queue_postgres.py -q --no-header -rN | grep -q "5 passed\|passed"


  demo:
    # The demo project is what every end-to-end claim rests on. If it stops building,
    # the review pipeline has nothing to run against and the eval numbers are stale.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Start Trino (Hive and Iceberg catalogs)
        # The repository's own compose service, not a bare image: the catalogs are files
        # in the checkout, and a service container starts before the checkout exists.
        run: docker compose up -d --wait trino

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Build the demo project on Trino (Hive marts, Iceberg reference data)
        working-directory: demo_project
        run: |
          dbt seed --profiles-dir . --project-dir .
          dbt build --profiles-dir . --project-dir .

      - name: Run the incremental model again
        # The run that breaks. The first build of an incremental model is a CREATE TABLE
        # AS and succeeds whatever its strategy; on Hive, `delete+insert` fails only on
        # the second, which is exactly how such a model merges green.
        working-directory: demo_project
        run: dbt build --profiles-dir . --project-dir . --select fct_revenue_incremental

      - name: Build on the offline fallback
        # DuckDB is not what anything is measured on, but `--target duckdb` is the way to
        # work without a container, and it should not rot.
        working-directory: demo_project
        run: |
          dbt seed --profiles-dir . --project-dir . --target duckdb
          dbt build --profiles-dir . --project-dir . --target duckdb

      - name: Grain derivation runs and reports coverage
        run: themis grain --project demo_project --explain

  corpus:
    # The mutation corpus has caught four defects in the reviewer that the unit tests
    # did not, including two rules that had never fired at all. It is slower than the
    # other jobs because every mutation builds the project twice, and worth it.
    runs-on: ubuntu-latest
    # 43 cases, each building both revisions. It took 18 minutes when most rules were
    # skipped; with every rule running it needs the headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The harness builds worktrees at the base revision and needs its history.
          fetch-depth: 0

      - name: Start Trino (Hive and Iceberg catalogs)
        # The repository's own compose service, not a bare image: the catalogs are files
        # in the checkout, and a service container starts before the checkout exists.
        run: docker compose up -d --wait trino

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Identify for the scratch commits the harness makes
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "themis-ci"

      - name: Build the demo project
        # Built, not just seeded. `dim_entities` generates SQL from a query against
        # `stg_accounts` at compile time; with only seeds loaded that table does not
        # exist, every compile aborts, and twenty of twenty-nine rules skip on every
        # mutation. This job reported 9/29 rule coverage and passed for ten days that way.
        working-directory: demo_project
        run: |
          dbt seed --profiles-dir . --project-dir .
          dbt build --profiles-dir . --project-dir .

      - name: Run the mutation corpus
        # Fails on the gate: an unscorable case, a missed defect, a flagged control, or a
        # rule that never fired. `themis eval --help` lists what it checks.
        run: themis eval --project demo_project --mutations all --base HEAD

  trino-review:
    # The engine this tool targets, end to end: dbt-trino compiles and builds the demo
    # project, a fan-out is reviewed with execution against Trino, and the run's schemas
    # must be gone afterwards. The `check` job only ever exercised the Trino client.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start Trino (Hive and Iceberg catalogs)
        # The repository's own compose service, not a bare image: the catalogs are files
        # in the checkout, and a service container starts before the checkout exists.
        run: docker compose up -d --wait trino

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Review a fan-out on Trino
        run: python scripts/trino_smoke.py
