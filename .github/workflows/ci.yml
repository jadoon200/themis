name: CI

# Frugal by design: ubuntu-only, single Python, narrow triggers, in-progress runs
# cancelled. No model is ever downloaded here — the review runs deterministic-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres is here because SELECT ... FOR UPDATE SKIP LOCKED is the whole basis for
    # handing a queued run to exactly one worker, and SQLite has no row locking — the
    # clause is skipped there, so without a real database that path is never exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: themis
          POSTGRES_PASSWORD: themis
          POSTGRES_DB: themis
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U themis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      THEMIS_TEST_POSTGRES_URL: postgresql+psycopg://themis:themis@127.0.0.1:5436/themis
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/themis

      - name: Migrations apply to Postgres
        env:
          THEMIS_DATABASE_URL: postgresql+psycopg://themis:themis@127.0.0.1:5436/themis
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q

      - name: Confirm the Postgres queue tests actually ran
        # These skip themselves when no database is reachable, so a broken service
        # container would silently reduce coverage rather than fail.
        run: pytest tests/test_queue_postgres.py -q --no-header -rN | grep -q "5 passed\|passed"


  demo:
    # The demo project is what every end-to-end claim rests on. If it stops building,
    # the review pipeline has nothing to run against and the eval numbers are stale.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Build the demo project on DuckDB
        working-directory: demo_project
        run: |
          dbt seed --profiles-dir . --project-dir . --target dev
          dbt build --profiles-dir . --project-dir . --target dev

      - name: Grain derivation runs and reports coverage
        run: themis grain --project demo_project --explain

  corpus:
    # The mutation corpus has caught four defects in the reviewer that the unit tests
    # did not, including two rules that had never fired at all. It is slower than the
    # other jobs because every mutation builds the project twice, and worth it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # The harness diffs against main and needs real history to do it.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Identify for the scratch commits the harness makes
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "themis-ci"

      - name: Seed the demo project
        working-directory: demo_project
        run: dbt seed --profiles-dir . --project-dir . --target dev

      - name: Run the mutation corpus
        run: themis eval --project demo_project --mutations all --base origin/main
