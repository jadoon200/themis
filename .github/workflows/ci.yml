name: CI

# Frugal by design: ubuntu-only, single Python, narrow triggers, in-progress runs
# cancelled. No model is ever downloaded here — the review runs deterministic-only.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/themis

      - name: Pytest
        run: pytest -q

  demo:
    # The demo project is what every end-to-end claim rests on. If it stops building,
    # the review pipeline has nothing to run against and the eval numbers are stale.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Build the demo project on DuckDB
        working-directory: demo_project
        run: |
          dbt seed --profiles-dir . --project-dir . --target dev
          dbt build --profiles-dir . --project-dir . --target dev

      - name: Grain derivation runs and reports coverage
        run: themis grain --project demo_project --explain
