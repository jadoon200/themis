# Local infrastructure. Postgres on 5436 — clear of the sibling projects
# (sentinel 5432, argus 5433, pharos 5434, horus 5435). Trino on 8085.
#
# Everything here is free, open source, and has an arm64 image, so it runs natively on
# Apple Silicon. Trino is capped at 4 GB, which is plenty for the demo project and leaves a
# laptop usable — with its heap at 60% of that, not the image's 80%. At 80% the rest of the
# JVM (code cache, metaspace, threads, buffers) had 800 MB, grew past it over a day of
# corpus runs, and the kernel killed the container mid-check (OOMKilled, exit 137).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: themis
      POSTGRES_PASSWORD: themis
      POSTGRES_DB: themis
    ports:
      - "5436:5432"
    volumes:
      - themis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themis"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trino runs as uid 1000 and cannot create directories on a fresh volume, which is
  # owned by root. Without this, writes are accepted and land nowhere.
  trino-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /warehouse/hive /warehouse/iceberg && chown -R 1000:1000 /warehouse"]
    volumes:
      - themis-trino-warehouse:/warehouse

  # The engine of record: Hive for most tables, Iceberg for snapshot history. Pinned,
  # because a Trino release can change what SQL it accepts, and a review measured on one
  # version should be reproducible on the same one.
  trino:
    image: trinodb/trino:483
    depends_on:
      trino-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
      - themis-trino-warehouse:/warehouse
    mem_limit: 4g
    # And if it is killed anyway, it comes back; the warehouse is on the volume.
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  themis-pgdata:
  themis-trino-warehouse:
