# Iceberg: where slowly-changing data produced by snapshots will live. MERGE works here,
# and dbt snapshots need it, which Hive cannot do. The file-based catalog keeps the
# container self-contained; which catalog service tracks the tables is invisible to SQL.
connector.name=iceberg
iceberg.catalog.type=testing_file_metastore
hive.metastore.catalog.dir=local:///iceberg
fs.native-local.enabled=true
local.location=/warehouse
