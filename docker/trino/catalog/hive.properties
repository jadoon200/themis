# Hive: how most tables are written at the office. A file metastore and the local file
# system stand in for the metastore service and object store — the SQL surface, the
# table properties and the write semantics are the connector's own. In particular a
# row-level DELETE is refused here exactly as it is there, so an incremental model has
# to overwrite partitions rather than delete rows by key.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///hive
fs.native-local.enabled=true
local.location=/warehouse
hive.non-managed-table-writes-enabled=true
