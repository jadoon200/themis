<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand_name }}{% endblock %} · {{ brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('ui-static', path='themis.css') }}?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/ui">
        {% if logo_url %}
          <img src="{{ logo_url }}" alt="{{ brand_name }}">
        {% else %}
          <span class="brand-mark">{{ brand_name[:1] }}</span>
        {% endif %}
        <span>
          <div class="brand-name">{{ brand_name }}</div>
          <div class="brand-sub">{{ brand_subtitle }}</div>
        </span>
      </a>
      <nav class="nav">
        <a href="/ui" class="{{ 'active' if page == 'overview' }}">Overview</a>
        <a href="/ui/prs" class="{{ 'active' if page == 'prs' }}">Pull requests</a>
        <a href="/ui/decisions" class="{{ 'active' if page == 'decisions' }}">Decisions</a>
      </nav>
      <div class="who">
        {% if trusted_identity %}
          <span class="who-note">Signed in as</span>
          <span class="who-chip" style="cursor: default">{{ user or "unknown" }}</span>
        {% else %}
          <span class="who-note">Demo · decisions recorded as</span>
          <button class="who-chip" type="button" data-set-name>{{ user or "set your name" }}</button>
        {% endif %}
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('ui-static', path='themis.js') }}?v={{ asset_version }}"></script>
</body>
</html>
